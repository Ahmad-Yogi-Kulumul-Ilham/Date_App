# Local infrastructure for development: MySQL 8.4 and Redis.
# Start with: docker compose up -d
name: leochat

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: leochat
      MYSQL_USER: leochat
      MYSQL_PASSWORD: leochat
      MYSQL_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  redis-data:
