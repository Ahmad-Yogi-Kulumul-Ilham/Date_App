# Salin ke /etc/nginx/sites-available/l.duzi.live, lalu jalankan
# certbot --nginx -d l.duzi.live untuk menambahkan HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name l.duzi.live;

    # Foto profil maksimal 5 MB, ditambah overhead multipart.
    client_max_body_size 6M;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        # Ditimpa, bukan ditambahkan, supaya klien tidak bisa memalsukan IP
        # untuk mengakali rate limit login (dihitung per IP).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
