# Production stack for the VPS (l.duzi.live). MySQL is the one already
# running on the host, so this file only adds the API and a small Redis.
# See deploy/README.md for the full setup.
# Start with: docker compose -f docker-compose.prod.yml up -d --build
name: leochat

services:
  backend:
    build: ./backend
    env_file: backend/.env
    # Host networking lets the API reach the host MySQL on 127.0.0.1 and
    # listen on 127.0.0.1:3003 for Nginx without exposing a public port.
    network_mode: host
    volumes:
      - storage:/www/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3003/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    mem_limit: 256m
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # noeviction: the token blacklist and queue jobs must never be dropped
    # silently when memory runs out.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 192m
    restart: unless-stopped

volumes:
  storage:
  redis-data:
